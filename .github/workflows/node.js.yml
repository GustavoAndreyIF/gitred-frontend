name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        
        with:
          node-version: 24
          cache: npm
          
      - name: Install dependencies
        run: npm ci
        
      #- name: Run lint
      #  run: npm run lint
        
      - name: Run tests
        run: npm test -- --watch=false --no-progress
        
      - name: Build Angular application
        run: npm run build

      - name: Run Angular server
        if: github.event_name == 'push'
        run: npm start
